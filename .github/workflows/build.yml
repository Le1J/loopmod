name: Build Loopmod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: loopmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
